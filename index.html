.dpad{

.right{

/* =========================================
   SPEECH SYSTEM
========================================= */

let voices = [];


function loadVoices(){

    voices =
    speechSynthesis.getVoices();

}


loadVoices();


if("onvoiceschanged" in speechSynthesis){

    speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* =========================================
   FIND LANGUAGE VOICE
========================================= */

function findVoice(code){

    loadVoices();


    let exact =
    voices.find(function(v){

        return v.lang.toLowerCase() ===
        code.toLowerCase();

    });


    if(exact){

        return exact;

    }


    let shortCode =
    code.substring(0,2).toLowerCase();


    return voices.find(function(v){

        return v.lang
        .toLowerCase()
        .startsWith(shortCode);

    }) || null;

}


/* =========================================
   SPEAK
========================================= */

function speak(text){

    if(!("speechSynthesis" in window)){

        alert(
        "Voice is not supported by this browser."
        );

        return;

    }


    let language =
    languages[languageIndex];


    let voice =
    findVoice(language.code);


    speechSynthesis.cancel();


    let utterance =
    new SpeechSynthesisUtterance(text);


    utterance.lang =
    language.code;

    utterance.rate =
    0.78;

    utterance.pitch =
    1;

    utterance.volume =
    1;


    if(voice){

        utterance.voice =
        voice;

    }


    speechSynthesis.speak(
    utterance
    );

}

        ${lang.menu.map(function(item,index){

    /* INFO */

/* =========================================
   NUMBER KEYPAD
========================================= */

function keyPress(key){

    /* NUMBER PAGE */

    if(page === "number"){

        if(
        key >= "0" &&
        key <= "9"
        ){

            if(farmerNumber.length < 10){

                farmerNumber += key;

                render();

            }


            if(farmerNumber.length === 10){

                setTimeout(function(){

                    page = "language";

                    render();

                    speak(
                    languages[languageIndex]
                    .voice.language
                    );

                },500);

            }

        }


        else if(key === "*"){

            farmerNumber =
            farmerNumber.slice(0,-1);

            render();

        }


        else if(key === "#"){

            if(farmerNumber.length === 10){

                page = "language";

                render();

                speak(
                languages[languageIndex]
                .voice.language
                );

            }

            else{

                speak(
                languages[languageIndex]
                .voice.invalid
                );

            }

        }

        return;

    }


    /* LANGUAGE PAGE */

    if(page === "language"){

        if(key === "1"){

            languageIndex = 0;

            openMenu();

        }

        else if(key === "2"){

            languageIndex = 1;

            openMenu();

        }

        else if(key === "3"){

            languageIndex = 2;

            openMenu();

        }

        return;

    }


    /* MENU */

    if(page === "menu"){

        let n =
        parseInt(key);


        if(n >= 1 && n <= 5){

            menuIndex =
            n - 1;

            page = "info";

            render();

            speakCurrentInfo();

        }

    }

}


/* =========================================
   OPEN MENU
========================================= */

function openMenu(){

    page = "menu";

    menuIndex = 0;

    render();

    setTimeout(function(){

        speak(

        );

    },300);

}

/* =========================================

========================================= */

function speakMenu(){

    let lang =

    let text =
    lang.menuTitle +
    ". ";

    lang.menu.forEach(function(item,index){

        text +=
        (index+1) +
        ". " +
        item +
        ". ";

    });


    speak(text);

}


/* =========================================
   DPAD UP
========================================= */

function moveUp(){

    if(page === "language"){

        languageIndex--;

        if(languageIndex < 0){

            languageIndex = 2;

        }

        render();

    }


    else if(page === "menu"){

        menuIndex--;

        if(menuIndex < 0){

            menuIndex = 4;

        }

        render();

    }

}


/* =========================================
   DPAD DOWN
========================================= */

function moveDown(){

    if(page === "language"){

        languageIndex++;

        if(languageIndex > 2){

            languageIndex = 0;

        }

        render();

    }


    else if(page === "menu"){

        menuIndex++;

        if(menuIndex > 4){

            menuIndex = 0;

        }

        render();

    }

}


/* =========================================
   DPAD LEFT
========================================= */

function moveLeft(){

    if(page === "info"){

        page = "menu";

        render();

        speakMenu();

    }

}


/* =========================================
   DPAD RIGHT
========================================= */

function moveRight(){

    if(page === "number"){

        if(farmerNumber.length === 10){

            page = "language";

            render();

            speakLanguage();

        }

    }


    else if(page === "menu"){

        page = "info";

        render();

        speakCurrentInfo();

    }

}


/* =========================================
   OK BUTTON
========================================= */

function selectOK(){

    if(page === "language"){

        openMenu();

    }


    else if(page === "menu"){

        page = "info";

        render();

        speakCurrentInfo();

    }

}


/* =========================================
   BACK / END BUTTON
========================================= */

function goBack(){

    speechSynthesis.cancel();


    if(page === "number"){

        farmerNumber = "";

        render();

    }


    else if(page === "language"){

        page = "number";

        render();

    }


    else if(page === "menu"){

        page = "language";

        render();

    }


    else if(page === "info"){

        page = "menu";

        render();

    }

}

/* =========================================
   CLOCK
========================================= */

function updateClock(){

    let now =
    new Date();


    let h =
    String(now.getHours())
    .padStart(2,"0");


    let m =
    String(now.getMinutes())
    .padStart(2,"0");


    document.getElementById("clock")
    .innerText =
    h + ":" + m;

}


setInterval(
updateClock,
1000
);

updateClock();


/* =========================================
   KEYBOARD SUPPORT
========================================= */

document.addEventListener(
"keydown",
function(e){

    if(
    e.key >= "0" &&
    e.key <= "9"
    ){

        keyPress(e.key);

    }


    else if(e.key === "*"){

        keyPress("*");

    }


    else if(e.key === "#"){

        keyPress("#");

    }


    else if(e.key === "ArrowUp"){

        moveUp();

    }


    else if(e.key === "ArrowDown"){

        moveDown();

    }


    else if(e.key === "ArrowLeft"){

        moveLeft();

    }


    else if(e.key === "ArrowRight"){

        moveRight();

    }


    else if(e.key === "Enter"){

        selectOK();

    }


    else if(e.key === "Escape"){

        goBack();

    }

});


/* =========================================
   START
========================================= */

render();
